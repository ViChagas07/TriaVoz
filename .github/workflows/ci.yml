name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: triavoz }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: triavoz
      TRIAVOZ_OWNER_PASSWORD: ci-owner
      TRIAVOZ_APP_PASSWORD: ci-app
      TRIAVOZ_OPS_PASSWORD: ci-ops
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "poetry==2.4.1" && poetry install
      - name: Create DB roles
        working-directory: .
        run: bash infra/postgres/init/01-roles.sh
      - name: Migrate (as owner)
        env:
          TRIAVOZ_DATABASE_URL_OWNER: postgresql+psycopg://triavoz_owner:ci-owner@localhost:5432/triavoz
        run: poetry run alembic upgrade head
      - run: poetry run ruff check src tests migrations scripts
      - run: poetry run ruff format --check src tests migrations scripts
      - run: poetry run mypy src
      - name: Tests (incl. tenant isolation — blocks merge)
        env:
          TRIAVOZ_TEST_OWNER_DSN: postgresql://triavoz_owner:ci-owner@localhost:5432/triavoz
          TRIAVOZ_TEST_APP_DSN: postgresql://triavoz_app:ci-app@localhost:5432/triavoz
          TRIAVOZ_TEST_OPS_DSN: postgresql://triavoz_ops:ci-ops@localhost:5432/triavoz
        run: poetry run pytest -q
      - run: pip install pip-audit && poetry export --without-hashes -f requirements.txt | pip-audit -r /dev/stdin
        continue-on-error: true   # TODO(P09): make blocking once the baseline is clean

  agent:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "poetry==2.4.1" && poetry install
      - run: poetry run ruff check src tests
      - run: poetry run mypy src
      - run: poetry run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true   # TODO(P09): make blocking

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
