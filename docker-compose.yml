# Local development stack. Dev credentials only — never reuse them anywhere else.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres-dev}
      POSTGRES_DB: triavoz
      TRIAVOZ_OWNER_PASSWORD: ${TRIAVOZ_OWNER_PASSWORD:-owner-dev}
      TRIAVOZ_APP_PASSWORD: ${TRIAVOZ_APP_PASSWORD:-app-dev}
      TRIAVOZ_OPS_PASSWORD: ${TRIAVOZ_OPS_PASSWORD:-ops-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro   # creates roles + extensions (first start only)
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triavoz"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  livekit:
    # TODO(verify-docs): confirm flags/ports for the current livekit-server release. --dev uses
    # the well-known dev key pair (devkey / secret): LOCAL ONLY.
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "${LIVEKIT_WS_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      TRIAVOZ_DATABASE_URL_OWNER: postgresql+psycopg://triavoz_owner:${TRIAVOZ_OWNER_PASSWORD:-owner-dev}@postgres:5432/triavoz
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: ./apps/api
    environment:
      TRIAVOZ_ENVIRONMENT: development
      TRIAVOZ_DATABASE_URL_APP: postgresql+asyncpg://triavoz_app:${TRIAVOZ_APP_PASSWORD:-app-dev}@postgres:5432/triavoz
      TRIAVOZ_REDIS_URL: redis://redis:6379/0
      TRIAVOZ_JWT_SECRET: ${TRIAVOZ_JWT_SECRET:-dev-only-jwt-secret-change-me-32-bytes-min}
      TRIAVOZ_INTERNAL_HMAC_SECRET: ${TRIAVOZ_INTERNAL_HMAC_SECRET:-dev-only-hmac-secret-change-me-32-bytes}
      TRIAVOZ_CORS_ORIGINS: '["http://localhost:3000"]'
      TRIAVOZ_COOKIE_SECURE: ${TRIAVOZ_COOKIE_SECURE:-false}
      TRIAVOZ_DEMO_CLINIC_SLUG: ${TRIAVOZ_DEMO_CLINIC_SLUG:-clinica-horizonte}
      TRIAVOZ_LIVEKIT_HTTP_URL: ${TRIAVOZ_LIVEKIT_HTTP_URL:-http://livekit:7880}
      TRIAVOZ_LIVEKIT_PUBLIC_URL: ${TRIAVOZ_LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      TRIAVOZ_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      TRIAVOZ_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      TRIAVOZ_LOG_FORMAT: ${TRIAVOZ_LOG_FORMAT:-json}
      TRIAVOZ_METRICS_ENABLED: ${TRIAVOZ_METRICS_ENABLED:-true}
      TRIAVOZ_SENTRY_DSN: ${TRIAVOZ_SENTRY_DSN:-}
      TRIAVOZ_SENTRY_TRACES_SAMPLE_RATE: ${TRIAVOZ_SENTRY_TRACES_SAMPLE_RATE:-0}
      TRIAVOZ_OTEL_EXPORTER_ENDPOINT: ${TRIAVOZ_OTEL_EXPORTER_ENDPOINT:-}
      TRIAVOZ_OTEL_SERVICE_NAME: triavoz-api
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["${API_HOST_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  agent:
    build: ./apps/agent
    # Least privilege: pass only voice/provider settings. DB credentials stay in the API/migrate
    # services and are never injected into the worker.
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      TRIAVOZ_API_URL: http://api:8000
      TRIAVOZ_HANDOFF_SIP_URI: ${TRIAVOZ_HANDOFF_SIP_URI:-}
      TRIAVOZ_INTERNAL_HMAC_SECRET: ${TRIAVOZ_INTERNAL_HMAC_SECRET}
      TRIAVOZ_LLM_MODEL: ${TRIAVOZ_LLM_MODEL:-}
      TRIAVOZ_STT_MODEL: ${TRIAVOZ_STT_MODEL:-nova-3}
      TRIAVOZ_STT_LANGUAGE: ${TRIAVOZ_STT_LANGUAGE:-pt-BR}
      TRIAVOZ_TTS_VOICE_ID: ${TRIAVOZ_TTS_VOICE_ID:-}
      TRIAVOZ_TTS_MODEL: ${TRIAVOZ_TTS_MODEL:-}
      TRIAVOZ_TTS_PROVIDER: ${TRIAVOZ_TTS_PROVIDER:-cartesia}
      TRIAVOZ_TTS_LANGUAGE: ${TRIAVOZ_TTS_LANGUAGE:-pt-BR}
      TRIAVOZ_MAX_CALL_SECONDS: ${TRIAVOZ_MAX_CALL_SECONDS:-300}
      TRIAVOZ_MAX_TURNS: ${TRIAVOZ_MAX_TURNS:-20}
      TRIAVOZ_SILENCE_TIMEOUT_SECONDS: ${TRIAVOZ_SILENCE_TIMEOUT_SECONDS:-15}
      TRIAVOZ_EMERGENCY_GRACE_SECONDS: ${TRIAVOZ_EMERGENCY_GRACE_SECONDS:-20}
      TRIAVOZ_PRICE_STT_PER_MIN_CENTS: ${TRIAVOZ_PRICE_STT_PER_MIN_CENTS:-0}
      TRIAVOZ_PRICE_LLM_IN_PER_M_CENTS: ${TRIAVOZ_PRICE_LLM_IN_PER_M_CENTS:-0}
      TRIAVOZ_PRICE_LLM_OUT_PER_M_CENTS: ${TRIAVOZ_PRICE_LLM_OUT_PER_M_CENTS:-0}
      TRIAVOZ_PRICE_TTS_PER_K_CHARS_CENTS: ${TRIAVOZ_PRICE_TTS_PER_K_CHARS_CENTS:-0}
      TRIAVOZ_LOG_FORMAT: ${TRIAVOZ_LOG_FORMAT:-json}
      TRIAVOZ_SENTRY_DSN: ${TRIAVOZ_SENTRY_DSN:-}
      TRIAVOZ_SENTRY_TRACES_SAMPLE_RATE: ${TRIAVOZ_SENTRY_TRACES_SAMPLE_RATE:-0}
      TRIAVOZ_OTEL_EXPORTER_ENDPOINT: ${TRIAVOZ_OTEL_EXPORTER_ENDPOINT:-}
      TRIAVOZ_OTEL_SERVICE_NAME: triavoz-voice-worker
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVEN_API_KEY: ${ELEVEN_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [api, livekit]

  web:
    build:
      context: ./apps/web
      args:
        API_ORIGIN: http://api:8000
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
    environment:
      API_ORIGIN: http://api:8000
      COOKIE_PREFIX: ${COOKIE_PREFIX:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3300}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Optional observability stack: `docker compose --profile observability up`.
  # Kept out of the default `make up` so the demo stays lightweight.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROMETHEUS_HOST_PORT:-9090}:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_HOST_PORT:-3001}:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
