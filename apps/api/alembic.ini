[alembic]
script_location = migrations
prepend_sys_path = src
# The URL is NOT stored here: migrations read TRIAVOZ_DATABASE_URL_OWNER (role triavoz_owner).

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
